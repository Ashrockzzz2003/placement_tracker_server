version: '3.8'

services:
  server:
    build: .
    ports:
      - "5000:5000"
    environment:
      - DB_HOST=db
      - DB_USER=root
      - DB_PASSWORD=root
      - DB_NAME=placement_tracker
      - SECRET_KEY=supersecretkey
    depends_on:
      - db
    restart: always

  db:
    image: mysql:8.0
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=placement_tracker
    ports:
      - "3309:3306"
    volumes:
      - db_data:/var/lib/mysql
    restart: always

volumes:
  db_data:
